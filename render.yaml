services:
  - type: web
    name: geopolitical-investment-agent
    env: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: DB_PATH
        value: "/data/portfolio.db"
      - key: DOCUMENTS_PATH
        value: "/data/documents"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
