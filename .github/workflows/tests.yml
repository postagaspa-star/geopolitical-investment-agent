name: Tests (money paths)

# Esegue la suite anti-regressione sui path dei soldi (contabilita',
# NAV direction-aware, FIFO+fee, replay audit) a OGNI push/PR che tocca
# il backend. Blocca le regressioni dei bug che ci hanno fatto sanguinare.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    name: pytest backend/tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run money-path tests
        # I test forzano SQLite (DB_PATH temp + niente SUPABASE_*) via conftest,
        # quindi NON servono API key ne' servizi esterni.
        run: python -m pytest backend/tests/ -q
