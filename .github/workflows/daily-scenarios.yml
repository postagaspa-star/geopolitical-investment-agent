name: Scenario Generator (3x/day)

# RAZIONALE FREQUENZA
# Con ~40-50 run/giorno del Simulator, il pool di scenari dinamici si
# consuma velocemente (scadenza default 30gg, cap 200). Per garantire
# >= 2 nuovi scenari al giorno, schedulo 3 run/giorno a orari diversi:
#   - 06:00 UTC  = mattina Europa (Asia close + news Asia notturne)
#   - 14:00 UTC  = pre-open Wall Street (rotazione news USA/macro)
#   - 22:00 UTC  = post-close USA (rotazione news Americas/Asia early)
#
# Ogni run target 5 scenari, con MIN_VALID_SCENARIOS=2 garantito (retry
# se < 2 validi). 3 run × 5 target = ~15 scenari/giorno (best case),
# almeno 2-3/giorno in caso di failures parziali su singole esecuzioni.

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC — mattina Europa
    - cron: '0 14 * * *'    # 14:00 UTC — pre-open Wall Street
    - cron: '0 22 * * *'    # 22:00 UTC — post-close USA
  workflow_dispatch:        # trigger manuale dalla UI GitHub
    inputs:
      target_scenarios:
        description: 'Numero scenari da generare (default 5)'
        required: false
        default: '5'

jobs:
  generate-scenarios:
    name: Genera scenari dinamici per il Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SCENARIO_UPLOAD_TOKEN: ${{ secrets.SCENARIO_UPLOAD_TOKEN }}
      GEOINVEST_API_BASE_URL: ${{ secrets.GEOINVEST_API_BASE_URL }}
      # Override target via workflow_dispatch input, default 5 per cron
      TARGET_SCENARIOS: ${{ github.event.inputs.target_scenarios || '5' }}
      # Min guarantee: lo script ritenta se < di questo (default 2)
      MIN_VALID_SCENARIOS: '2'
      # Toggle Auriko (opzionale). Se i secrets non esistono questi
      # restano stringa vuota → build_scenarios.py usa il pattern
      # (env or default) e ripiega su DeepSeek ufficiale (comportamento
      # storico, zero rischio). Per testare il generator via Auriko basta
      # AURIKO_API_KEY; gli altri sono override fini opzionali.
      #   Catena: Auriko(MODEL_V3) → Auriko(MODEL_V3_FALLBACK) → DeepSeek ufficiale
      AURIKO_API_KEY: ${{ secrets.AURIKO_API_KEY }}
      AURIKO_BASE_URL: ${{ secrets.AURIKO_BASE_URL }}
      AURIKO_MODEL_V3: ${{ secrets.AURIKO_MODEL_V3 }}
      AURIKO_MODEL_V3_FALLBACK: ${{ secrets.AURIKO_MODEL_V3_FALLBACK }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp==3.9.5

      - name: Verify env vars
        id: verify_secrets
        run: |
          missing=()
          [ -z "$DEEPSEEK_API_KEY" ] && missing+=("DEEPSEEK_API_KEY")
          [ -z "$SCENARIO_UPLOAD_TOKEN" ] && missing+=("SCENARIO_UPLOAD_TOKEN")
          [ -z "$GEOINVEST_API_BASE_URL" ] && missing+=("GEOINVEST_API_BASE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets mancanti su GitHub: ${missing[*]}"
            echo "Vai su Settings → Secrets and variables → Actions e configura:"
            for m in "${missing[@]}"; do echo "  - $m"; done
            exit 1
          fi
          echo "✓ Tutti e 3 i secrets configurati"
          echo "Backend target: $GEOINVEST_API_BASE_URL"
          echo "Target scenari/run: $TARGET_SCENARIOS (min guarantee: $MIN_VALID_SCENARIOS)"

      - name: Health check backend (aspetta fino a 4 min se in restart)
        id: health
        run: |
          # Il backend puo' essere in restart (post-OOM, redeploy, resume da
          # sospensione): un 503 istantaneo NON e' un buon motivo per
          # procedere (storicamente: 24 giorni di upload falliti perche' lo
          # step accettava il 503 e il POST moriva in ~10s di retry).
          # Aspettiamo /health=200 fino a 4 minuti; 404 = errore hard.
          deadline=$(( $(date +%s) + 240 ))
          while true; do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 "$GEOINVEST_API_BASE_URL/health" || echo "000")
            echo "Health check HTTP: $http_code ($(date -u +%H:%M:%S))"
            if [ "$http_code" = "200" ]; then
              echo "✓ Backend healthy"
              break
            elif [ "$http_code" = "404" ]; then
              echo "::error::Endpoint /health non esiste (404) — deploy rotto?"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Backend non healthy dopo 4 min (ultimo HTTP: $http_code). Controlla Render (sospensione billing? OOM loop?)."
              exit 1
            fi
            sleep 10
          done

      - name: Run scenario generator
        id: gen
        env:
          NUM_SCENARIOS_TARGET: ${{ env.TARGET_SCENARIOS }}
          MIN_VALID_SCENARIOS: ${{ env.MIN_VALID_SCENARIOS }}
        run: |
          python backend/tools/build_scenarios.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Query pool dimension after upload
        if: always()
        id: pool
        run: |
          response=$(curl -s --max-time 10 \
            "$GEOINVEST_API_BASE_URL/api/simulator/scenarios/dynamic" || echo "")
          if [ -n "$response" ]; then
            # Estrai count (no jq disponibile di default)
            count=$(echo "$response" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('count', 'n/a'))" 2>/dev/null || echo "parse-fail")
            echo "Pool dinamico attuale: $count scenari attivi"
            echo "active_count=$count" >> $GITHUB_OUTPUT
          else
            echo "active_count=unknown" >> $GITHUB_OUTPUT
          fi

      - name: GitHub Step Summary
        if: always()
        run: |
          echo "## 📊 Scenario Generator — Run Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valore |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp UTC | $(date -u +'%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ env.GEOINVEST_API_BASE_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target scenari | ${{ env.TARGET_SCENARIOS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Min guarantee | ${{ env.MIN_VALID_SCENARIOS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Job status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pool size dopo upload | ${{ steps.pool.outputs.active_count }} scenari attivi |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "failure" ]; then
            echo "### ❌ Run fallito" >> $GITHUB_STEP_SUMMARY
            echo "Controlla i log degli step sopra per la causa specifica." >> $GITHUB_STEP_SUMMARY
            echo "Cause tipiche: secrets mancanti, backend down, DeepSeek API quota, GDELT non risponde." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✓ Run completato" >> $GITHUB_STEP_SUMMARY
          fi
