name: Daily Scenario Generator

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (08:00 Roma in inverno, 07:00 BST etc.)
    - cron: '0 6 * * *'
  workflow_dispatch:   # consente trigger manuale dalla UI GitHub

jobs:
  generate-scenarios:
    name: Genera scenari dinamici per il Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SCENARIO_UPLOAD_TOKEN: ${{ secrets.SCENARIO_UPLOAD_TOKEN }}
      GEOINVEST_API_BASE_URL: ${{ secrets.GEOINVEST_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp==3.9.5

      - name: Verify env vars
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then echo "::error::DEEPSEEK_API_KEY mancante"; exit 1; fi
          if [ -z "$SCENARIO_UPLOAD_TOKEN" ]; then echo "::error::SCENARIO_UPLOAD_TOKEN mancante"; exit 1; fi
          if [ -z "$GEOINVEST_API_BASE_URL" ]; then echo "::error::GEOINVEST_API_BASE_URL mancante"; exit 1; fi
          echo "Tutte le env vars configurate."
          echo "Backend target: $GEOINVEST_API_BASE_URL"

      - name: Run scenario generator
        run: python backend/tools/build_scenarios.py

      - name: Summary
        if: always()
        run: |
          echo "## Daily Scenario Generator" >> $GITHUB_STEP_SUMMARY
          echo "- **Run timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: ${{ env.GEOINVEST_API_BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
